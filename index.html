<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주 탐험 퀴즈</title>
<style>
  :root {
    --bg1: #0b1026;
    --bg2: #1b1446;
    --card: rgba(18, 24, 56, 0.92);
    --text: #f4f6ff;
    --muted: #b9c0e6;
    --accent: #ffd166;
    --accent-2: #7cc6ff;
    --ok: #3ddc97;
    --ok-bg: #0f3d2e;
    --bad: #ff7b8a;
    --bad-bg: #4a1a26;
    --border: #4a55a0;
    --focus: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at 20% 10%, var(--bg2), var(--bg1) 70%);
    background-attachment: fixed;
    line-height: 1.6;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
    position: relative;
    overflow-x: hidden;
  }
  /* 별 배경 */
  .stars, .stars::before, .stars::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 30% 70%, #fff, transparent),
      radial-gradient(2px 2px at 50% 40%, #ffe9a8, transparent),
      radial-gradient(1px 1px at 70% 80%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 85% 25%, #bfe3ff, transparent),
      radial-gradient(1px 1px at 92% 60%, #fff, transparent),
      radial-gradient(1px 1px at 18% 88%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 62% 12%, #fff, transparent);
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars::before { transform: scale(1.7) rotate(20deg); animation-delay: -1.5s; opacity: .7; }
  .stars::after  { transform: scale(2.4) rotate(-12deg); animation-delay: -3s; opacity: .5; }
  @keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }

  main {
    position: relative;
    width: 100%;
    max-width: 720px;
  }
  header { text-align: center; margin-bottom: 16px; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0; letter-spacing: .5px; }
  h1 .rocket { display: inline-block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px) rotate(-6deg); } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: clamp(18px, 4vw, 32px);
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .hidden { display: none !important; }

  /* 상단 상태 */
  .status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .score-pill {
    background: #2a2f66;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 4px 14px;
    border-radius: 999px;
  }
  .score-pill.bump { animation: bump .45s ease; }
  @keyframes bump { 40% { transform: scale(1.25); } }

  .progress-track {
    height: 14px;
    background: #262c63;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width .5s ease;
  }

  h2#question {
    font-size: clamp(1.2rem, 3.2vw, 1.55rem);
    margin: 0 0 20px;
    outline: none;
  }
  .emoji-big { font-size: 3rem; text-align: center; margin-bottom: 8px; }

  .options { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .option {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    font: inherit;
    font-size: 1.05rem;
    color: var(--text);
    background: #20275a;
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    min-height: 56px;
    cursor: pointer;
    box-shadow: 0 4px 0 #0b1026;
    transition: transform .15s ease, box-shadow .15s ease,
                background-color .4s ease, border-color .4s ease, opacity .4s ease;
  }
  .option:hover:not(:disabled) { background: #2b3380; border-color: var(--accent-2); transform: translateY(-2px); box-shadow: 0 6px 0 #0b1026; }
  .option:active:not(:disabled) {
    transform: translateY(3px) scale(.985);
    box-shadow: 0 1px 0 #0b1026, inset 0 3px 8px rgba(0,0,0,.45);
    background: #1a2050;
    transition-duration: .05s;
  }
  .option:disabled { cursor: default; box-shadow: 0 2px 0 #0b1026; }
  .option:focus-visible {
    outline: 4px solid var(--focus);
    outline-offset: 4px;
    border-color: var(--accent);
    box-shadow: 0 0 0 8px rgba(255, 209, 102, .55), 0 4px 0 #0b1026;
  }
  .option .key {
    flex: none;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: #0b1026;
    border: 1px solid var(--border);
    font-weight: 700;
  }
  .option .mark { margin-left: auto; font-size: 1.3rem; font-weight: 700; }

  .option.correct { background: var(--ok-bg); border-color: var(--ok); animation: pop .5s ease; }
  .option.wrong   { background: var(--bad-bg); border-color: var(--bad); animation: shake .5s ease; }
  .option.dim { opacity: .6; }
  @keyframes pop {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(61,220,151,.8); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); box-shadow: 0 0 0 18px rgba(61,220,151,0); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    border-left: 6px solid;
    animation: slideIn .35s ease;
  }
  .feedback.ok  { background: var(--ok-bg);  border-color: var(--ok); }
  .feedback.bad { background: var(--bad-bg); border-color: var(--bad); }
  .feedback strong { display: block; margin-bottom: 4px; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } }

  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    color: #1a1a2e;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    min-height: 48px;
    cursor: pointer;
    transition: transform .15s, filter .15s;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn.secondary { background: transparent; color: var(--text); border: 2px solid var(--accent-2); }
  .actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }

  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  /* 시작 / 결과 화면 */
  .center { text-align: center; }
  .center p { color: var(--muted); }
  .big-score { font-size: 3.2rem; font-weight: 800; color: var(--accent); margin: 8px 0; }
  .rank { font-size: 1.3rem; font-weight: 700; }
  .stars-row { font-size: 2rem; letter-spacing: 6px; margin: 8px 0; }
  .stars-row span { display: inline-block; animation: starIn .5s ease backwards; }
  @keyframes starIn { from { transform: scale(0) rotate(-90deg); opacity: 0; } }

  /* 전체 문제 검토 화면 */
  h2#review-title { font-size: clamp(1.2rem, 3.2vw, 1.55rem); margin: 0 0 4px; outline: none; }
  .rv-list { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 12px; }
  .rv-item { padding: 14px 16px; border-radius: 12px; background: #20275a; border-left: 6px solid; }
  .rv-item.ok  { border-color: var(--ok); }
  .rv-item.bad { border-color: var(--bad); }
  .rv-q { font-size: 1.05rem; margin: 0 0 6px; }
  .rv-status { margin: 0 0 6px; font-weight: 700; }
  .rv-item.ok  .rv-status { color: var(--ok); }
  .rv-item.bad .rv-status { color: var(--bad); }
  .rv-line { margin: 2px 0; }
  .rv-explain { margin: 6px 0 0; color: var(--muted); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .hint { color: var(--muted); font-size: .9rem; margin-top: 14px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>

<main>
  <header>
    <h1><span class="rocket" aria-hidden="true">🚀</span> 우주 탐험 퀴즈</h1>
  </header>

  <!-- 시작 화면 -->
  <section id="start" class="card center" aria-labelledby="start-title">
    <div class="emoji-big" aria-hidden="true">🪐</div>
    <h2 id="start-title">우주 비행사가 될 준비가 되셨나요?</h2>
    <p>태양계와 우주 탐사에 관한 10개의 문제에 도전해 보세요.</p>
    <p class="hint">마우스, 터치, 또는 키보드(숫자 1~4, Enter)로 풀 수 있어요.</p>
    <div style="margin-top:20px"><button class="btn" id="start-btn" type="button">탐험 시작</button></div>
  </section>

  <!-- 퀴즈 화면 -->
  <section id="quiz" class="card hidden" aria-labelledby="question">
    <div class="status">
      <span id="counter">문제 1 / 10</span>
      <span class="score-pill" id="score">점수: 0</span>
    </div>
    <div class="progress-track" id="progress" role="progressbar" aria-label="퀴즈 진행률"
         aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" aria-valuetext="0문제 완료, 총 10문제">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="emoji-big" id="q-emoji" aria-hidden="true"></div>
    <h2 id="question" tabindex="-1"></h2>
    <ul class="options" id="options"></ul>

    <div id="feedback" role="status" aria-live="polite"></div>

    <div class="actions">
      <button class="btn hidden" id="next-btn" type="button">다음 문제 →</button>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="result" class="card center hidden" aria-labelledby="result-title">
    <div class="emoji-big" id="r-emoji" aria-hidden="true"></div>
    <h2 id="result-title" tabindex="-1">탐험 완료!</h2>
    <div class="big-score" id="final-score"></div>
    <div class="stars-row" id="stars-row" aria-hidden="true"></div>
    <div class="rank" id="rank"></div>
    <p id="rank-msg"></p>

    <div class="actions" style="justify-content:center">
      <button class="btn secondary" id="review-btn" type="button">전체 문제 검토</button>
      <button class="btn" id="restart-btn" type="button">다시 도전하기</button>
    </div>
  </section>

  <!-- 전체 문제 검토 화면 -->
  <section id="review-screen" class="card hidden" aria-labelledby="review-title">
    <h2 id="review-title" tabindex="-1">전체 문제 검토</h2>
    <p class="hint" id="rv-summary"></p>
    <ol class="rv-list" id="rv-list"></ol>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="review-back-btn" type="button">← 결과로 돌아가기</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  const QUESTIONS = [
    { emoji: "🪐", q: "태양계에서 가장 큰 행성은 무엇일까요?",
      options: ["목성", "토성", "지구", "해왕성"], answer: 0,
      explain: "목성은 지름이 지구의 약 11배로 태양계에서 가장 큰 행성입니다." },
    { emoji: "🔴", q: "'붉은 행성'이라고 불리는 행성은?",
      options: ["수성", "화성", "금성", "천왕성"], answer: 1,
      explain: "화성 표면의 산화철(녹) 때문에 붉게 보입니다." },
    { emoji: "🌕", q: "인류 최초로 달에 발을 디딘 사람은?",
      options: ["유리 가가린", "버즈 올드린", "닐 암스트롱", "존 글렌"], answer: 2,
      explain: "1969년 아폴로 11호의 닐 암스트롱이 처음으로 달 표면을 밟았습니다." },
    { emoji: "🌌", q: "우리 태양계가 속해 있는 은하의 이름은?",
      options: ["안드로메다 은하", "대마젤란 은하", "삼각형자리 은하", "우리은하(은하수)"], answer: 3,
      explain: "태양계는 막대 나선 은하인 우리은하(은하수)에 속해 있습니다." },
    { emoji: "💍", q: "아름다운 고리로 가장 유명한 행성은?",
      options: ["토성", "화성", "수성", "금성"], answer: 0,
      explain: "토성의 고리는 얼음과 암석 조각으로 이루어져 있습니다." },
    { emoji: "☀️", q: "태양의 빛이 지구에 도달하는 데 걸리는 시간은 약 얼마일까요?",
      options: ["약 8초", "약 8분", "약 8시간", "약 8일"], answer: 1,
      explain: "태양까지의 거리는 약 1억 5천만 km로, 빛이 약 8분 20초 만에 도달합니다." },
    { emoji: "🛰️", q: "1957년에 발사된 인류 최초의 인공위성은?",
      options: ["보이저 1호", "허블 우주망원경", "스푸트니크 1호", "아폴로 11호"], answer: 2,
      explain: "소련이 발사한 스푸트니크 1호가 최초의 인공위성입니다." },
    { emoji: "🔭", q: "현재 태양계의 행성은 모두 몇 개일까요?",
      options: ["7개", "9개", "10개", "8개"], answer: 3,
      explain: "2006년 명왕성이 왜행성으로 분류되면서 태양계 행성은 8개가 되었습니다." },
    { emoji: "🇰🇷", q: "2022년 발사된 대한민국 최초의 달 궤도선의 이름은?",
      options: ["다누리", "나로호", "누리호", "아리랑"], answer: 0,
      explain: "달 탐사선 '다누리'는 2022년 8월 발사되어 달 궤도에서 임무를 수행했습니다." },
    { emoji: "🔥", q: "태양계에서 표면 온도가 가장 높은 행성은?",
      options: ["수성", "금성", "화성", "목성"], answer: 1,
      explain: "금성은 두꺼운 이산화탄소 대기의 온실 효과로 평균 약 460°C에 달합니다." }
  ];

  const RANKS = [
    { min: 10, emoji: "🏆", title: "우주 사령관", msg: "완벽해요! 우주에 대해 모르는 게 없네요." },
    { min: 8,  emoji: "🚀", title: "베테랑 우주 비행사", msg: "훌륭해요! 은하계 탐사도 문제없겠어요." },
    { min: 5,  emoji: "🛰️", title: "견습 우주 비행사", msg: "좋은 출발이에요! 조금만 더 공부하면 사령관이 될 수 있어요." },
    { min: 0,  emoji: "🌠", title: "우주 새싹", msg: "괜찮아요, 모든 탐험은 첫걸음부터 시작해요. 다시 도전해 보세요!" }
  ];

  const $ = (id) => document.getElementById(id);
  const startEl = $("start"), quizEl = $("quiz"), resultEl = $("result"), reviewEl = $("review-screen");
  const counterEl = $("counter"), scoreEl = $("score");
  const progressEl = $("progress"), fillEl = $("progress-fill");
  const emojiEl = $("q-emoji"), questionEl = $("question"), optionsEl = $("options");
  const feedbackEl = $("feedback"), nextBtn = $("next-btn");
  const total = QUESTIONS.length;

  let index = 0, score = 0, answered = false, current = null, history = [];

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function show(el) {
    [startEl, quizEl, resultEl, reviewEl].forEach((s) => s.classList.add("hidden"));
    el.classList.remove("hidden");
  }

  function updateProgress(done) {
    fillEl.style.width = (done / total * 100) + "%";
    progressEl.setAttribute("aria-valuenow", done);
    progressEl.setAttribute("aria-valuetext", done + "문제 완료, 총 " + total + "문제");
  }

  function updateScore(bump) {
    scoreEl.textContent = "점수: " + score;
    if (bump) {
      scoreEl.classList.remove("bump");
      void scoreEl.offsetWidth;
      scoreEl.classList.add("bump");
    }
  }

  function start() {
    index = 0; score = 0; history = [];
    updateScore(false);
    updateProgress(0);
    show(quizEl);
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const item = QUESTIONS[index];
    const opts = shuffle(item.options.map((text, i) => ({ text, correct: i === item.answer })));
    current = { item, opts };

    counterEl.textContent = "문제 " + (index + 1) + " / " + total;
    emojiEl.textContent = item.emoji;
    questionEl.textContent = item.q;
    feedbackEl.innerHTML = "";
    nextBtn.classList.add("hidden");
    nextBtn.textContent = index === total - 1 ? "결과 보기 🏁" : "다음 문제 →";
    optionsEl.innerHTML = "";

    opts.forEach((o, i) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option";
      btn.dataset.index = i;
      btn.innerHTML = '<span class="key" aria-hidden="true">' + (i + 1) + '</span>' +
                      '<span class="text"></span><span class="mark" aria-hidden="true"></span>';
      btn.querySelector(".text").textContent = o.text;
      btn.setAttribute("aria-label", (i + 1) + "번, " + o.text);
      btn.addEventListener("click", () => choose(i));
      li.appendChild(btn);
      optionsEl.appendChild(li);
    });
    questionEl.focus({ preventScroll: false });
  }

  function choose(i) {
    if (answered) return;
    answered = true;
    const { item, opts } = current;
    const picked = opts[i];
    const buttons = optionsEl.querySelectorAll(".option");

    buttons.forEach((b, k) => {
      b.disabled = true;
      const mark = b.querySelector(".mark");
      if (opts[k].correct) {
        b.classList.add("correct");
        mark.textContent = "✓";
        b.setAttribute("aria-label", (k + 1) + "번, " + opts[k].text + ", 정답");
      } else if (k === i) {
        b.classList.add("wrong");
        mark.textContent = "✕";
        b.setAttribute("aria-label", (k + 1) + "번, " + opts[k].text + ", 선택한 오답");
      } else {
        b.classList.add("dim");
      }
    });

    if (picked.correct) { score++; updateScore(true); }
    const correctText = opts.find((o) => o.correct).text;
    history.push({ emoji: item.emoji, q: item.q, correct: picked.correct, picked: picked.text, answer: correctText, explain: item.explain });
    updateProgress(index + 1);

    const fb = document.createElement("div");
    fb.className = "feedback " + (picked.correct ? "ok" : "bad");
    fb.innerHTML = "<strong></strong><span></span>";
    fb.querySelector("strong").textContent = picked.correct
      ? "✓ 정답입니다!"
      : "✕ 아쉬워요! 정답은 \"" + correctText + "\"입니다.";
    fb.querySelector("span").textContent = item.explain;
    feedbackEl.appendChild(fb);

    nextBtn.classList.remove("hidden");
    nextBtn.focus();
  }

  function next() {
    if (!answered) return;
    index++;
    if (index < total) renderQuestion(); else showResult();
  }

  function showResult() {
    show(resultEl);
    const rank = RANKS.find((r) => score >= r.min);
    $("r-emoji").textContent = rank.emoji;
    $("final-score").textContent = score + " / " + total;
    $("rank").textContent = rank.title;
    $("rank-msg").textContent = rank.msg;

    const starCount = Math.round(score / total * 5);
    const row = $("stars-row");
    row.innerHTML = "";
    for (let i = 0; i < 5; i++) {
      const s = document.createElement("span");
      s.textContent = i < starCount ? "⭐" : "☆";
      s.style.animationDelay = (i * 0.15) + "s";
      row.appendChild(s);
    }

    $("result-title").focus();
  }

  function reviewLine(cls, label, text) {
    const p = document.createElement("p");
    p.className = cls;
    const b = document.createElement("strong");
    b.textContent = label + " ";
    p.appendChild(b);
    p.appendChild(document.createTextNode(text));
    return p;
  }

  function renderReview() {
    const list = $("rv-list");
    list.innerHTML = "";
    $("rv-summary").textContent = "총 " + total + "문제 중 " + score + "문제를 맞혔어요.";
    history.forEach((h, n) => {
      const li = document.createElement("li");
      li.className = "rv-item " + (h.correct ? "ok" : "bad");

      const title = document.createElement("h3");
      title.className = "rv-q";
      const emoji = document.createElement("span");
      emoji.setAttribute("aria-hidden", "true");
      emoji.textContent = h.emoji + " ";
      title.appendChild(emoji);
      title.appendChild(document.createTextNode("문제 " + (n + 1) + ". " + h.q));
      li.appendChild(title);

      const status = document.createElement("p");
      status.className = "rv-status";
      const mark = document.createElement("span");
      mark.setAttribute("aria-hidden", "true");
      mark.textContent = h.correct ? "✓ " : "✕ ";
      status.appendChild(mark);
      status.appendChild(document.createTextNode(h.correct ? "정답" : "오답"));
      li.appendChild(status);

      li.appendChild(reviewLine("rv-line", "내가 고른 답:", h.picked));
      if (!h.correct) li.appendChild(reviewLine("rv-line", "정답:", h.answer));
      li.appendChild(reviewLine("rv-explain", "해설:", h.explain));
      list.appendChild(li);
    });
  }

  function openReview() {
    renderReview();
    show(reviewEl);
    window.scrollTo(0, 0);
    $("review-title").focus();
  }

  function closeReview() {
    show(resultEl);
    $("review-btn").focus();
  }

  $("start-btn").addEventListener("click", start);
  $("restart-btn").addEventListener("click", start);
  $("review-btn").addEventListener("click", openReview);
  $("review-back-btn").addEventListener("click", closeReview);
  nextBtn.addEventListener("click", next);

  // 키보드 단축키: 1~4 로 선택
  document.addEventListener("keydown", (e) => {
    if (quizEl.classList.contains("hidden") || answered || e.ctrlKey || e.metaKey || e.altKey) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= current.opts.length) { e.preventDefault(); choose(n - 1); }
  });
})();
</script>
</body>
</html>
